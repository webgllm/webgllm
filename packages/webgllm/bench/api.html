<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebGLLM API smoke test</title>
  <style>
    body { background: #13171c; color: #eef3f8; font: 14px ui-monospace, monospace; margin: 20px; }
    pre { white-space: pre-wrap; }
  </style>
  <h1>WebGLLM API smoke test</h1>
  <p>Runs the public API end to end: <code>?model=&lt;id&gt;</code> (LFM2.5 350M GGUF by default), <code>&second=&lt;id&gt;</code> to also load a second model at once.</p>
  <pre id="out"></pre>
  <script type="module">
    // `?baseline=1` runs another checkout's sources, linked at bench/baseline-src
    // (`ln -s /path/to/checkout/packages/webgllm/src bench/baseline-src`).
    const { WebGLLM, WebGLLMError } = await import(
      new URLSearchParams(location.search).get("baseline") === "1" ? "/bundle/bench/baseline-src/index.js" : "/bundle/src/index.js"
    )

    const out = document.getElementById("out")
    const log = (...parts) => {
      const line = parts.map((p) => (typeof p === "string" ? p : JSON.stringify(p))).join(" ")
      out.textContent += line + "\n"
      fetch("/log", { method: "POST", body: line }).catch(() => {})
    }
    const params = new URLSearchParams(location.search)
    const model = params.get("model") ?? "LiquidAI/LFM2.5-350M-GGUF"
    const second = params.get("second")
    const check = (name, ok, detail) => log(`${ok ? "PASS" : "FAIL"} ${name}`, detail ?? "")

    try {
      log("isSupported", WebGLLM.isSupported())
      const webgllm = new WebGLLM({
        onProgress: (p) => {
          if (p.progress === 1 || Math.round(p.progress * 100) % 25 === 0) log("progress", p.model, p.phase, p.progress.toFixed(2), p.cached)
        }
      })
      // `?think=0`: thinking off for requests that don't ask for it, so a
      // model that thinks by default (LFM3) answers within short max_tokens.
      if (params.get("think") === "0") {
        const create = webgllm.chat.completions.create.bind(webgllm.chat.completions)
        webgllm.chat.completions.create = (body, options) =>
          create(body.reasoning_effort != null || body.reasoning != null ? body : { reasoning_effort: "none", ...body }, options)
      }

      const list = await webgllm.models.list()
      log("models", list.map((m) => `${m.id} downloaded=${m.downloaded} ctx=${m.contextLength} size=${m.size}`))

      let t = performance.now()
      await webgllm.loadModel(model, { contextLength: 8192 })
      log("loaded", model, `${Math.round(performance.now() - t)} ms`)
      log("info", await webgllm.models.retrieve(model))

      // Basic, non-streaming.
      const basic = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "What is the capital of France? Answer in one short sentence." }],
        temperature: 0
      })
      log("basic", basic.choices[0].message, basic.choices[0].finish_reason, basic.usage, basic.timings)
      check("basic answer mentions Paris", /paris/i.test(basic.choices[0].message.content ?? ""))

      // Streaming with usage.
      const stream = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Count from 1 to 5, separated by commas." }],
        temperature: 0,
        stream: true,
        stream_options: { include_usage: true }
      })
      let text = "", chunks = 0, usage
      for await (const chunk of stream) {
        chunks++
        text += chunk.choices[0]?.delta?.content ?? ""
        if (chunk.usage) usage = chunk.usage
      }
      log("stream", { text, chunks, usage })
      check("stream yields several chunks and usage", chunks > 3 && !!usage)

      // Stop sequence.
      const stopped = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Count from 1 to 10, separated by commas." }],
        temperature: 0,
        stop: ["5"]
      })
      const stoppedText = stopped.choices[0].message.content ?? ""
      log("stop", stoppedText, stopped.choices[0].finish_reason)
      check("stop sequence cuts before 5", !stoppedText.includes("5") && stoppedText.includes("4"))

      // max_tokens → length.
      const short = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Write a long story about a dragon." }],
        max_tokens: 8
      })
      log("max_tokens", short.choices[0].message.content, short.choices[0].finish_reason, short.usage.completion_tokens)
      check("max_tokens ends with length", short.choices[0].finish_reason === "length")

      // Seed reproducibility.
      const seeded = async () =>
        (await webgllm.chat.completions.create({
          model,
          messages: [{ role: "user", content: "Invent a name for a fantasy city." }],
          temperature: 1,
          seed: 42,
          max_tokens: 24
        })).choices[0].message.content
      const [a, b] = [await seeded(), await seeded()]
      log("seed", a, "|", b)
      check("same seed gives the same reply", a === b)

      // Structured output.
      const json = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Extract: Ada Lovelace, born 1815 in London." }],
        response_format: {
          type: "json_schema",
          json_schema: {
            name: "person",
            schema: {
              type: "object",
              properties: { name: { type: "string" }, born: { type: "integer" }, city: { type: "string" } },
              required: ["name", "born", "city"],
              additionalProperties: false
            }
          }
        }
      })
      const parsed = JSON.parse(json.choices[0].message.content ?? "null")
      log("json_schema", parsed)
      check("json_schema answer parses with the fields", parsed && typeof parsed.born === "number" && typeof parsed.name === "string")

      // Tool calls: auto, then a forced call.
      const tools = [{
        type: "function",
        function: {
          name: "get_weather",
          description: "Get the current weather for a city",
          parameters: { type: "object", properties: { city: { type: "string" } }, required: ["city"] }
        }
      }]
      const messages = [{ role: "user", content: "What's the weather in Paris right now?" }]
      const auto = await webgllm.chat.completions.create({ model, messages, tools, temperature: 0 })
      log("tools auto", auto.choices[0].message, auto.choices[0].finish_reason)

      const forced = await webgllm.chat.completions.create({ model, messages, tools, tool_choice: "required", temperature: 0 })
      const call = forced.choices[0].message.tool_calls?.[0]
      log("tools required", forced.choices[0].message, forced.choices[0].finish_reason)
      check("required tool_choice returns a get_weather call", call?.function.name === "get_weather" && forced.choices[0].finish_reason === "tool_calls")

      if (call) {
        const followup = await webgllm.chat.completions.create({
          model,
          tools,
          temperature: 0,
          messages: [
            ...messages,
            forced.choices[0].message,
            { role: "tool", tool_call_id: call.id, content: JSON.stringify({ city: "Paris", temperature_c: 18, sky: "sunny" }) }
          ]
        })
        log("tool result answer", followup.choices[0].message.content)
        check("answer uses the tool result", /18/.test(followup.choices[0].message.content ?? ""))
      }

      // Tool-call repair: a required enum the model tends to leave out.
      const strictTools = [{
        type: "function",
        function: {
          name: "get_weather",
          description: "Get the current weather for a city",
          parameters: {
            type: "object",
            properties: { city: { type: "string" }, units: { type: "string", enum: ["celsius", "fahrenheit"] } },
            required: ["city", "units"]
          }
        }
      }]
      const ask = [{ role: "user", content: "What's the weather in Paris right now?" }]
      const raw = await webgllm.chat.completions.create({ model, messages: ask, tools: strictTools, temperature: 0, repair_tool_calls: false })
      const repaired = await webgllm.chat.completions.create({ model, messages: ask, tools: strictTools, temperature: 0 })
      const rawCall = raw.choices[0].message.tool_calls?.[0]
      const fixedCall = repaired.choices[0].message.tool_calls?.[0]
      log("repair raw", rawCall?.function ?? raw.choices[0].message.content, raw.usage.completion_tokens)
      log("repair fixed", fixedCall?.function ?? repaired.choices[0].message.content, repaired.usage)
      const fixedArgs = fixedCall ? JSON.parse(fixedCall.function.arguments) : null
      check("repaired call has both required arguments", !!fixedArgs && typeof fixedArgs.city === "string" && ["celsius", "fahrenheit"].includes(fixedArgs.units))

      // Abort mid-stream.
      const controller = new AbortController()
      let aborted = false
      try {
        const s = await webgllm.chat.completions.create(
          { model, messages: [{ role: "user", content: "Write a long poem about the sea." }], stream: true },
          { signal: controller.signal }
        )
        let n = 0
        for await (const _ of s) if (++n === 5) controller.abort()
      } catch (error) {
        aborted = error instanceof DOMException && error.name === "AbortError"
      }
      check("abort rejects with AbortError", aborted)
      const after = await webgllm.chat.completions.create({ model, messages: [{ role: "user", content: "Say OK." }], max_tokens: 8 })
      check("the model still answers after an abort", (after.choices[0].message.content ?? "").length > 0, after.choices[0].message.content)

      // Errors.
      for (const [name, body, code] of [
        ["unknown model", { model: "nope/nope", messages: [{ role: "user", content: "hi" }] }, "model-not-supported"],
        ["n > 1", { model, n: 2, messages: [{ role: "user", content: "hi" }] }, "unsupported-parameter"]
      ]) {
        try {
          await webgllm.chat.completions.create(body)
          check(`error: ${name}`, false, "no error")
        } catch (error) {
          check(`error: ${name}`, error instanceof WebGLLMError && error.code === code, `${error?.code} ${error?.message}`)
        }
      }

      // Structured output with a stop string that occurs in the JSON: stop
      // doesn't apply inside a constrained answer, so it stays valid.
      const stopJson = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Reply in JSON with the capital of Norway as city." }],
        stop: ["{", "\""],
        response_format: {
          type: "json_schema",
          json_schema: { name: "capital", schema: { type: "object", properties: { city: { type: "string" } }, required: ["city"] } }
        }
      })
      let stopParsed = null
      try { stopParsed = JSON.parse(stopJson.choices[0].message.content ?? "") } catch {}
      log("json with stop", stopJson.choices[0].message.content, stopJson.choices[0].finish_reason)
      check("stop strings leave a structured answer valid", typeof stopParsed?.city === "string")

      // A required call among two tools whose schemas use local $defs.
      const defsTools = [
        {
          type: "function",
          function: {
            name: "set_alarm",
            description: "Set an alarm",
            parameters: {
              type: "object",
              $defs: { time: { type: "object", properties: { hour: { type: "integer" }, minute: { type: "integer" } }, required: ["hour", "minute"] } },
              properties: { at: { $ref: "#/$defs/time" } },
              required: ["at"]
            }
          }
        },
        {
          type: "function",
          function: {
            name: "get_weather",
            description: "Get the current weather for a city",
            parameters: { type: "object", definitions: { city: { type: "string" } }, properties: { city: { $ref: "#/definitions/city" } }, required: ["city"] }
          }
        }
      ]
      const alarm = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Set an alarm for 7:30 in the morning." }],
        tools: defsTools,
        tool_choice: "required",
        temperature: 0
      })
      const alarmCall = alarm.choices[0].message.tool_calls?.[0]
      const alarmArgs = alarmCall ? JSON.parse(alarmCall.function.arguments) : null
      log("required with $defs", alarmCall?.function)
      check(
        "required call among tools with $defs matches its schema",
        (alarmCall?.function.name === "set_alarm" && Number.isInteger(alarmArgs?.at?.hour) && Number.isInteger(alarmArgs?.at?.minute)) ||
          (alarmCall?.function.name === "get_weather" && typeof alarmArgs?.city === "string")
      )

      // Reads made before the first chunk each get a chunk, in order.
      const concurrent = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Count from 1 to 20, separated by commas." }],
        temperature: 0,
        stream: true
      })
      const iterator = concurrent[Symbol.asyncIterator]()
      const reads = await Promise.race([
        Promise.all([iterator.next(), iterator.next(), iterator.next()]),
        new Promise((resolve) => setTimeout(() => resolve(null), 30000))
      ])
      for (let r = await iterator.next(); !r.done; r = await iterator.next());
      log("concurrent reads", reads?.map((r) => r.done))
      check("three reads made at once all settle", Array.isArray(reads) && reads.every((r) => r.done === false))

      // A repetition penalty must be greater than 0.
      try {
        await webgllm.chat.completions.create({ model, messages: [{ role: "user", content: "hi" }], repetition_penalty: 0 })
        check("repetition_penalty 0 is refused", false, "no error")
      } catch (error) {
        check("repetition_penalty 0 is refused", /repetition_penalty/.test(error?.message ?? ""), error?.message)
      }

      // Large top_k and nucleus sampling: seeded, so repeatable.
      for (const sampling of [{ top_k: 2048 }, { top_k: 0, top_p: 0.9 }]) {
        const draw = async () =>
          (await webgllm.chat.completions.create({
            model,
            messages: [{ role: "user", content: "Invent a name for a ship." }],
            temperature: 1,
            seed: 7,
            max_tokens: 16,
            ...sampling
          })).choices[0].message.content
        const [x, y] = [await draw(), await draw()]
        log("sampling", sampling, x, "|", y)
        check(`seeded sampling repeats with ${JSON.stringify(sampling)}`, !!x && x === y)
      }

      // A new context length asked for while a reply streams: the reply
      // finishes, then the model loads again for the new length.
      const resizeStream = await webgllm.chat.completions.create({
        model,
        messages: [{ role: "user", content: "Count from 1 to 40, separated by commas." }],
        temperature: 0,
        max_tokens: 96,
        stream: true
      })
      let resizeText = "", resizeChunks = 0, resizeLoad
      for await (const chunk of resizeStream) {
        resizeText += chunk.choices[0]?.delta?.content ?? ""
        if (++resizeChunks === 5) resizeLoad = webgllm.loadModel(model, { contextLength: 4096 })
      }
      await resizeLoad
      const afterResize = await webgllm.chat.completions.create({ model, messages: [{ role: "user", content: "Say OK." }], max_tokens: 8 })
      log("resize during reply", { chunks: resizeChunks, text: resizeText.slice(0, 80), after: afterResize.choices[0].message.content })
      check("a reply finishes when a new context length is asked for", resizeChunks > 20 && resizeText.includes("20"))
      check("the model answers at the new context length", (afterResize.choices[0].message.content ?? "").length > 0)

      // Small contexts: 64 tokens loads and answers; below the minimum fails
      // with no download.
      await webgllm.loadModel(model, { contextLength: 64 })
      const tiny = await webgllm.chat.completions.create({ model, messages: [{ role: "user", content: "Hi" }], max_tokens: 4 })
      log("context 64", tiny.choices[0].message.content, tiny.usage)
      check("a 64-token context loads and answers", tiny.choices[0].message.content !== undefined)
      try {
        await webgllm.loadModel(model, { contextLength: 2 })
        check("a 2-token context is refused", false, "loaded")
      } catch (error) {
        check("a 2-token context is refused", true, `${error?.code ?? ""} ${error?.message ?? error}`)
      }

      // Download and load of the same model at once both settle.
      const [downloaded, loaded] = await Promise.allSettled([
        webgllm.downloadModel(model),
        webgllm.loadModel(model, { contextLength: 8192 })
      ])
      log("download with load", downloaded.status, loaded.status, downloaded.reason?.message ?? "", loaded.reason?.message ?? "")
      check("a download and a load at once both succeed", downloaded.status === "fulfilled" && loaded.status === "fulfilled")

      // A second model loaded at the same time.
      if (second) {
        // Download a model that isn't stored yet while loading it.
        await webgllm.models.delete(second).catch(() => {})
        t = performance.now()
        const [d2, l2] = await Promise.allSettled([
          webgllm.downloadModel(second),
          webgllm.loadModel(second, { contextLength: 8192 })
        ])
        log("fresh download with load", d2.status, l2.status, `${Math.round(performance.now() - t)} ms`, d2.reason?.message ?? "", l2.reason?.message ?? "")
        check("a fresh download and load at once both succeed", d2.status === "fulfilled" && l2.status === "fulfilled")
        // A load canceled while it waits for room doesn't unload the model
        // it was waiting on (a budget that fits one model).
        const tight = new WebGLLM({ memoryBudget: 1 })
        await tight.loadModel(model, { contextLength: 2048 })
        const busy = await tight.chat.completions.create({
          model,
          messages: [{ role: "user", content: "Count from 1 to 30, separated by commas." }],
          temperature: 0,
          stream: true
        })
        const cancel = new AbortController()
        const pending = tight.loadModel(second, { contextLength: 2048, signal: cancel.signal }).then(() => "loaded", (e) => e?.name ?? String(e))
        let busyChunks = 0
        for await (const _ of busy) if (++busyChunks === 3) cancel.abort()
        const outcome = await pending
        const stillLoaded = (await tight.models.list()).filter((m) => m.loaded).map((m) => m.id)
        log("canceled load", { outcome, busyChunks, stillLoaded })
        check("a canceled load leaves the busy model loaded", outcome !== "loaded" && stillLoaded.includes(model))
        await tight.unloadModel()


        t = performance.now()
        await webgllm.loadModel(second, { contextLength: 8192 })
        log("loaded second", second, `${Math.round(performance.now() - t)} ms`)
        const both = (await webgllm.models.list()).filter((m) => m.loaded).map((m) => m.id)
        log("loaded models", both)
        check("both models stay loaded", both.includes(model) && both.includes(second))
        const think = await webgllm.chat.completions.create({
          model: second,
          messages: [{ role: "user", content: "Is 391 prime? Answer yes or no." }],
          reasoning: { effort: "high", max_tokens: 256 }
        })
        log("second thinking", { reasoning: (think.choices[0].message.reasoning_content ?? "").slice(0, 200), content: think.choices[0].message.content }, think.usage)
        check("thinking arrives in reasoning_content", (think.choices[0].message.reasoning_content ?? "").length > 0)
        const again = await webgllm.chat.completions.create({ model, messages: [{ role: "user", content: "Say hi." }], max_tokens: 8 })
        check("first model still answers", (again.choices[0].message.content ?? "").length > 0)
      }

      await webgllm.unloadModel()
      log("ALL DONE")
    } catch (error) {
      log("ERROR:", error?.code ?? "", error?.message ?? String(error), error?.stack ?? "")
    }
  </script>
</html>
