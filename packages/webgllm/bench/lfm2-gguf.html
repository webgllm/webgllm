<!doctype html><meta charset="utf-8"><title>LFM2.5 GGUF validation</title><style>body{font:16px system-ui;background:#172030;color:#edf1f6;padding:32px}select,button{font:inherit;padding:12px;margin:6px}pre{white-space:pre-wrap;background:#253248;padding:20px;border-radius:12px;max-height:600px;overflow:auto}</style>
<h1>LFM2.5 GGUF validation</h1><p>Independent llama.cpp CPU distributions, real WebGL logits and state restoration. Model files and references are served locally; no production generation settings are changed.</p>
<label>Model <select id="model"><option value="350m">LFM2.5-350M-GGUF</option><option value="instruct">LFM2.5-1.2B-Instruct-GGUF</option><option value="thinking">LFM2.5-1.2B-Thinking-GGUF</option></select></label><label>Reference <select id="reference"><option value="q4">Original GGUF CPU</option><option value="f16">Dequantized F16 control (Instruct)</option></select></label><button id="run">Run numerical checks</button><p id="status" role="status">Ready</p><pre id="report"></pre>
<script type="module">
let worker;const status=document.querySelector('#status'),output=document.querySelector('#report');
document.querySelector('#run').onclick=()=>{if(worker)return;output.textContent='';worker=new Worker('/bundle/bench/lfm2-gguf-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='status')status.textContent=data.value;if(data.type==='done'){output.textContent=JSON.stringify(data.value,null,2);status.textContent=data.value.pass?'Passed':'Failed';worker.terminate();worker=null}};worker.onerror=event=>{status.textContent='Failed';output.textContent=event.message;worker.terminate();worker=null};worker.postMessage({key:document.querySelector('#model').value,reference:document.querySelector('#reference').value})};
</script>
