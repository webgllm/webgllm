<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>webgpu-coop</title>
<style>body{font:12px/1.4 ui-monospace,monospace;margin:12px}</style></head>
<body><pre id="out"></pre>
<script type="module">
// webgpu-wide.html's matvec plus cooperative variants (…k: a workgroup a group of 4 rows, its threads striding
// over K blocks so neighbours read neighbouring bytes, then a workgroup sum): b8k from the byte texels, bufk from a
// storage buffer. Sliced variants are checked against b8 by their slice sums.
// The engine's few-token 4-bit matvec (byte texels: a row's 32 weights of a block in 16 bytes, low nibbles values
// 4w+i and high 16+4w+i of word w; a scale per row and block) at LFM3 1.7B's shapes, the same bytes read three ways:
// RGBA8UI texels (as the engine reads them), RGBA32UI texels (16 bytes a fetch) and a storage buffer. Checks the
// three agree, then times them.
const out = document.getElementById("out")
const log = (t) => { out.textContent += `${t}\n`; void fetch("/log", { method: "POST", body: t }).catch(() => undefined) }
const q = new URLSearchParams(location.search)
try {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" })
  const requiredFeatures = ["shader-f16", "subgroups"].filter((f) => adapter.features.has(f))
  const device = await adapter.requestDevice({ requiredFeatures, requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize } })
  log(`COOP ${navigator.userAgent}`)
  log(`COOP limits wgStorage ${adapter.limits.maxComputeWorkgroupStorageSize} invocations ${adapter.limits.maxComputeInvocationsPerWorkgroup}`)
  log(`COOP features ${requiredFeatures.join(",")} vendor ${adapter.info?.vendor} ${adapter.info?.architecture} subgroup ${adapter.info?.subgroupMinSize}-${adapter.info?.subgroupMaxSize}`)
  const shapes = [["in_proj", 6144, 2048], ["gate+up", 15360, 2048], ["down", 2048, 7680], ["out", 2048, 2048]]
  const fragments = +(q.get("frags") ?? 8192)
  const wgX = +(q.get("wg") ?? 64)
  const variants = (q.get("v") ?? "b8,buf,b8k,bufk").split(",")
  const wgK = +(q.get("wgk") ?? 64)
  const coopKernel = (v) => {
    const W = v === "b8k" ? "var tW: texture_2d<u32>;" : "var<storage, read> bW: array<vec4<u32>>;"
    const words = v === "b8k"
      ? `let base = kb * 16u + r * 4u;
        let B0 = textureLoad(tW, vec2u(base, gr), 0); let B1 = textureLoad(tW, vec2u(base + 1u, gr), 0);
        let B2 = textureLoad(tW, vec2u(base + 2u, gr), 0); let B3 = textureLoad(tW, vec2u(base + 3u, gr), 0);
        let L0 = vec4f(B0 & vec4u(15u)); let H0 = vec4f(B0 >> vec4u(4u));
        let L1 = vec4f(B1 & vec4u(15u)); let H1 = vec4f(B1 >> vec4u(4u));
        let L2 = vec4f(B2 & vec4u(15u)); let H2 = vec4f(B2 >> vec4u(4u));
        let L3 = vec4f(B3 & vec4u(15u)); let H3 = vec4f(B3 >> vec4u(4u));`
      : `let Q = bW[gr * u.w32 + kb * 4u + r];
        let L0 = vec4f((vec4u(Q.x) >> SL) & vec4u(15u)); let H0 = vec4f((vec4u(Q.x) >> SH) & vec4u(15u));
        let L1 = vec4f((vec4u(Q.y) >> SL) & vec4u(15u)); let H1 = vec4f((vec4u(Q.y) >> SH) & vec4u(15u));
        let L2 = vec4f((vec4u(Q.z) >> SL) & vec4u(15u)); let H2 = vec4f((vec4u(Q.z) >> SH) & vec4u(15u));
        let L3 = vec4f((vec4u(Q.w) >> SL) & vec4u(15u)); let H3 = vec4f((vec4u(Q.w) >> SH) & vec4u(15u));`
    return `
struct U { kb: u32, slices: u32, kbSlice: u32, groups: u32, wx: u32, w32: u32 }
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) ${W}
@group(0) @binding(2) var tS: texture_2d<f32>;
@group(0) @binding(3) var tA: texture_2d<u32>;
@group(0) @binding(4) var<storage, read_write> o: array<vec4f>;
const SL = vec4u(0u, 8u, 16u, 24u);
const SH = vec4u(4u, 12u, 20u, 28u);
var<workgroup> red: array<vec4f, ${wgK}>;
fn h(a: vec4u) -> array<vec4f, 2> {
  let x = unpack2x16float(a.x); let y = unpack2x16float(a.y); let z = unpack2x16float(a.z); let w = unpack2x16float(a.w);
  return array<vec4f, 2>(vec4f(x.x, x.y, y.x, y.y), vec4f(z.x, z.y, w.x, w.y));
}
@compute @workgroup_size(${wgK}, 1)
fn main(@builtin(local_invocation_index) l: u32, @builtin(workgroup_id) w: vec3u) {
  let gr = w.x;
  var acc = vec4f(0.0);
  for (var kb = l; kb < u.kb; kb += ${wgK}u) {
    let d = textureLoad(tS, vec2u(kb, gr), 0);
    let a0 = h(textureLoad(tA, vec2u(kb * 4u, 0u), 0)); let a1 = h(textureLoad(tA, vec2u(kb * 4u + 1u, 0u), 0));
    let a2 = h(textureLoad(tA, vec2u(kb * 4u + 2u, 0u), 0)); let a3 = h(textureLoad(tA, vec2u(kb * 4u + 3u, 0u), 0));
    let A0 = a0[0]; let A1 = a0[1]; let A2 = a1[0]; let A3 = a1[1];
    let A4 = a2[0]; let A5 = a2[1]; let A6 = a3[0]; let A7 = a3[1];
    let sa = dot(A0 + A1 + A2 + A3 + A4 + A5 + A6 + A7, vec4f(1.0));
    var b = vec4f(0.0);
    for (var r = 0u; r < 4u; r++) {
      ${words}
      b[r] = dot(L0, A0) + dot(L1, A1) + dot(L2, A2) + dot(L3, A3) + dot(H0, A4) + dot(H1, A5) + dot(H2, A6) + dot(H3, A7);
    }
    acc += d * (b - 8.0 * sa);
  }
  red[l] = acc;
  workgroupBarrier();
  for (var st = ${wgK / 2}u; st > 0u; st >>= 1u) { if (l < st) { red[l] += red[l + st]; } workgroupBarrier(); }
  if (l == 0u) { o[gr] = red[0]; }
}`
  }
  // Plain reads (v=sum: the buffer, v=tsum: the byte texture), for this GPU's read bandwidth.
  const sumKernel = (v) => `
struct U { kb: u32, slices: u32, kbSlice: u32, groups: u32, wx: u32, w32: u32 }
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) ${v === "tsum" ? "var tW: texture_2d<u32>;" : "var<storage, read> bW: array<vec4<u32>>;"}
@group(0) @binding(4) var<storage, read_write> o: array<vec4f>;
@compute @workgroup_size(64, 1)
fn main(@builtin(global_invocation_id) id: vec3u, @builtin(num_workgroups) nw: vec3u) {
  let n = u.groups * u.w32${v === "tsum" ? " * 4u" : ""};
  let stride = nw.x * 64u;
  var a = vec4u(0u);
  for (var i = id.x; i < n; i += stride) { a ^= ${v === "tsum" ? "textureLoad(tW, vec2u(i % (u.w32 * 4u), i / (u.w32 * 4u)), 0)" : "bW[i]"}; }
  if (all(a == vec4u(1u, 2u, 3u, 4u))) { o[id.x] = vec4f(a); }
}`
  // Buffer matvecs that spread a row group's K blocks over neighbouring threads (dash-separated tokens):
  //   row-T: a thread per row and block: T threads per row group (4 rows x T/4 lanes over K), so a group's neighbouring
  //          threads read neighbouring 16-byte words. grp-L: a thread per row group and block (4 rows, 64 bytes),
  //          L lanes over K. wgN: workgroup size (default 64, holding several row groups). ab / sb: activations / scales
  //          from storage buffers (else textures). un: nibbles unpacked by unpack4x8unorm (else shifts and masks).
  //          sg: the lane sum by subgroupShuffleXor (else workgroup memory). f16: half math for the dots.
  //   ssum / csum: plain reads in buf's pattern (a thread per row group) / row-16's pattern, bandwidth only.
  const parse = (v) => {
    const t = v.split("-"), o = { kind: t[0], n: +t[1], wg: 64, ab: false, sb: false, un: false, sg: false, f16: false, fa: false, un2: false, u2: false, u4: false, x: 1, pf: false }
    for (const x of t.slice(2)) { if (x.startsWith("wg")) o.wg = +x.slice(2); else if (/^x\d$/.test(x)) o.x = +x.slice(1); else o[x] = true }
    return o
  }
  const K_MAX = 7680
  const isNew = (v) => v.startsWith("row-") || v.startsWith("grp-") || v.startsWith("pr-")
  const newKernel = (v) => {
    if (v.startsWith("pr-")) return prKernel(v)
    const o = parse(v)
    const row = o.kind === "row"
    const T = row ? o.n : o.n // threads per row group
    const lanes = row ? T / 4 : T
    const G = o.wg / T, R = o.x // R row groups per thread (same row and block), G apart
    const VR = R === 1 ? "f32" : `vec${R}f`
    const F = o.f16 ? "f16" : "f32", V = o.f16 ? "vec4h" : "vec4f"
    const A = o.ab ? `@group(0) @binding(3) var<storage, read> bA: array<vec4<u32>>;` : `@group(0) @binding(3) var tA: texture_2d<u32>;`
    const S = o.sb ? `@group(0) @binding(2) var<storage, read> bS: array<${row ? "f32" : "vec4f"}>;` : `@group(0) @binding(2) var tS: texture_2d<f32>;`
    const ld0 = (i) => o.ab ? `bA[${i}]` : `textureLoad(tA, vec2u(${i}, 0u), 0)`
    const ld = (i) => o.aw ? `sA[${i}]` : ld0(i)
    const scale = row
      ? (o.sb ? `bS[(gr * u.kb + kb) * 4u + r]` : `textureLoad(tS, vec2u(kb, gr), 0)[r]`)
      : (o.sb ? `bS[gr * u.kb + kb]` : `textureLoad(tS, vec2u(kb, gr), 0)`)
    // Row dot of one 16-byte word quad Q against the block's activations (A0..A7: values 4j..4j+3).
    const rowdot = o.un2
      ? `fn rd(Q: vec4u, a: array<${V}, 8>) -> ${F} {
  let m = 0x0F0F0F0Fu; let n = 0xF0F0F0F0u;
  let lo = dot(${V}(unpack4x8unorm(Q.x & m)), a[0]) + dot(${V}(unpack4x8unorm(Q.y & m)), a[1]) + dot(${V}(unpack4x8unorm(Q.z & m)), a[2]) + dot(${V}(unpack4x8unorm(Q.w & m)), a[3]);
  let hi = dot(${V}(unpack4x8unorm(Q.x & n)), a[4]) + dot(${V}(unpack4x8unorm(Q.y & n)), a[5]) + dot(${V}(unpack4x8unorm(Q.z & n)), a[6]) + dot(${V}(unpack4x8unorm(Q.w & n)), a[7]);
  return ${F}(255.0) * lo + ${F}(255.0 / 16.0) * hi;
}`
      : o.un
      ? `fn rd(Q: vec4u, a: array<${V}, 8>) -> ${F} {
  let m = 0x0F0F0F0Fu;
  let lo = dot(${V}(unpack4x8unorm(Q.x & m)), a[0]) + dot(${V}(unpack4x8unorm(Q.y & m)), a[1]) + dot(${V}(unpack4x8unorm(Q.z & m)), a[2]) + dot(${V}(unpack4x8unorm(Q.w & m)), a[3]);
  let hi = dot(${V}(unpack4x8unorm((Q.x >> 4u) & m)), a[4]) + dot(${V}(unpack4x8unorm((Q.y >> 4u) & m)), a[5]) + dot(${V}(unpack4x8unorm((Q.z >> 4u) & m)), a[6]) + dot(${V}(unpack4x8unorm((Q.w >> 4u) & m)), a[7]);
  return ${F}(255.0) * (lo + hi);
}`
      : `const SL = vec4u(0u, 8u, 16u, 24u);
const SH = vec4u(4u, 12u, 20u, 28u);
fn rd(Q: vec4u, a: array<${V}, 8>) -> ${F} {
  return dot(${V}((vec4u(Q.x) >> SL) & vec4u(15u)), a[0]) + dot(${V}((vec4u(Q.y) >> SL) & vec4u(15u)), a[1])
    + dot(${V}((vec4u(Q.z) >> SL) & vec4u(15u)), a[2]) + dot(${V}((vec4u(Q.w) >> SL) & vec4u(15u)), a[3])
    + dot(${V}((vec4u(Q.x) >> SH) & vec4u(15u)), a[4]) + dot(${V}((vec4u(Q.y) >> SH) & vec4u(15u)), a[5])
    + dot(${V}((vec4u(Q.z) >> SH) & vec4u(15u)), a[6]) + dot(${V}((vec4u(Q.w) >> SH) & vec4u(15u)), a[7]);
}`
    const h = o.f16
      ? `fn h(a: vec4u) -> array<vec4h, 2> { let x = bitcast<vec2h>(a.x); let y = bitcast<vec2h>(a.y); let z = bitcast<vec2h>(a.z); let w = bitcast<vec2h>(a.w);
  return array<vec4h, 2>(vec4h(x, y), vec4h(z, w)); }`
      : `fn h(a: vec4u) -> array<vec4f, 2> { let x = unpack2x16float(a.x); let y = unpack2x16float(a.y); let z = unpack2x16float(a.z); let w = unpack2x16float(a.w);
  return array<vec4f, 2>(vec4f(x, y), vec4f(z, w)); }`
    const acts = o.fa
      ? `let a = array<vec4f, 8>(bF[kb * 8u], bF[kb * 8u + 1u], bF[kb * 8u + 2u], bF[kb * 8u + 3u], bF[kb * 8u + 4u], bF[kb * 8u + 5u], bF[kb * 8u + 6u], bF[kb * 8u + 7u]);
  let sa = bSA[kb];`
      : `let a0 = h(${ld("kb * 4u")}); let a1 = h(${ld("kb * 4u + 1u")}); let a2 = h(${ld("kb * 4u + 2u")}); let a3 = h(${ld("kb * 4u + 3u")});
  let a = array<${V}, 8>(a0[0], a0[1], a1[0], a1[1], a2[0], a2[1], a3[0], a3[1]);
  let sa = f32(dot(a[0] + a[1] + a[2] + a[3] + a[4] + a[5] + a[6] + a[7], ${V}(1.0)));`
    // Diagnostics (results DIFF by design): ld = all loads, no math; nA = no activation loads; nS = no scale loads.
    const diag = o.ld
      ? `let x = ${ld("kb * 4u")} ^ ${ld("kb * 4u + 1u")} ^ ${ld("kb * 4u + 2u")} ^ ${ld("kb * 4u + 3u")};
  let Q = bW[gr * u.w32 + kb * 4u + r];
  let d = ${scale};
  return d * f32((Q.x ^ Q.y ^ Q.z ^ Q.w ^ x.x ^ x.y ^ x.z ^ x.w) & 1u);`
      : ""
    const body = o.ld ? "" : row && R > 1
      ? `var res: ${VR};
  ${Array.from({ length: R }, (_, k) => `{ let g2 = gr + ${k * G}u; let d = ${scale.replaceAll("gr", "g2")}; res[${k}] = d * (f32(rd(bW[g2 * u.w32 + kb * 4u + r], a)) - 8.0 * sa); }`).join("\n  ")}
  return res;`
      : row
      ? `let d = ${scale};
  return d * (f32(rd(${o.pf ? "Q" : "bW[gr * u.w32 + kb * 4u + r]"}, a)) - 8.0 * sa);`
      : `let d = ${scale};
  let base = gr * u.w32 + kb * 4u;
  let b = vec4f(f32(rd(bW[base], a)), f32(rd(bW[base + 1u], a)), f32(rd(bW[base + 2u], a)), f32(rd(bW[base + 3u], a)));
  return d * (b - 8.0 * sa);`
    const AT = row ? VR : "vec4f"
    // Lane sum: lanes of one (group, row) sit `step` threads apart.
    const step = row ? 4 : 1
    const reduce = o.ns
      ? (row ? `o[lane * u.groups * 4u + gr * 4u + r] = acc;` : `o4[lane * u.groups + gr] = acc;`)
      : o.r1
      ? `red[l] = acc;
  workgroupBarrier();
  if (lane == 0u) { var s = red[l]; for (var k = 1u; k < ${lanes}u; k++) { s += red[l + k * ${step}u]; } ${row ? "o[gr * 4u + r] = s;" : "o4[gr] = s;"} }`
      : o.sg
      ? `var s = acc;
  for (var st = ${lanes / 2 * step}u; st >= ${step}u; st >>= 1u) { s += subgroupShuffleXor(s, st); }
  if (lane == 0u) { ${row ? "o[gr * 4u + r] = s;" : "o4[gr] = s;"} }`
      : `red[l] = acc;
  workgroupBarrier();
  for (var st = ${lanes / 2}u; st > 0u; st >>= 1u) { if (lane < st) { red[l] += red[l + st * ${step}u]; } workgroupBarrier(); }
  if (lane == 0u) { ${row && R > 1 ? Array.from({ length: R }, (_, k) => `o[(gr + ${k * G}u) * 4u + r] = red[l][${k}];`).join(" ") : row ? "o[gr * 4u + r] = red[l];" : "o4[gr] = red[l];"} }`
    const U2 = o.u4 ? 4 : o.u2 ? 2 : 1
    const loop = o.pf
      ? `var Q = bW[gr * u.w32 + lane * 4u + r];
  for (var kb = lane; kb < u.kb; kb += ${lanes}u) {
    let Qn = bW[gr * u.w32 + min(kb + ${lanes}u, u.kb - 1u) * 4u + r];
    acc += blk(kb, gr, r, Q);
    Q = Qn;
  }`
      : U2 === 1
      ? `for (var kb = lane; kb < u.kb; kb += ${lanes}u) { acc += blk(kb, gr, r); }`
      : `for (var kb = lane; kb < u.kb; kb += ${lanes * U2}u) {
    ${Array.from({ length: U2 }, (_, k) => k === 0 ? "acc += blk(kb, gr, r);" : `if (kb + ${lanes * k}u < u.kb) { acc += blk(kb + ${lanes * k}u, gr, r); }`).join("\n    ")}
  }`
    return `${o.f16 ? "enable f16;\n" : ""}${o.sg ? "enable subgroups;\n" : ""}
struct U { kb: u32, slices: u32, kbSlice: u32, groups: u32, wx: u32, w32: u32 }
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read> bW: array<vec4<u32>>;
${S}
${o.fa ? "@group(0) @binding(5) var<storage, read> bF: array<vec4f>;\n@group(0) @binding(6) var<storage, read> bSA: array<f32>;" : A}
@group(0) @binding(4) var<storage, read_write> ${row ? "o: array<f32>" : "o4: array<vec4f>"};
${o.sg || o.ns ? "" : `var<workgroup> red: array<${AT}, ${o.wg}>;`}
${o.aw ? `var<workgroup> sA: array<vec4u, ${K_MAX / 8}>;` : ""}
${h}
${rowdot}
fn blk(kb: u32, gr: u32, r: u32${o.pf ? ", Q: vec4u" : ""}) -> ${AT} {
  ${o.ld ? diag : `${o.nA ? `let fk = f32(kb + textureDimensions(tA).y - 1u) * 0.001; let a = array<${V}, 8>(${V}(fk), ${V}(fk + 0.1), ${V}(fk + 0.2), ${V}(fk + 0.3), ${V}(fk + 0.4), ${V}(fk + 0.5), ${V}(fk + 0.6), ${V}(fk + 0.7)); let sa = f32(fk);` : acts}
  ${o.nS ? body.replace(/let d = [^;]*;/, `let d = ${row ? "f32(gr + textureDimensions(tS).y - u.groups) * 0.001" : "vec4f(f32(gr + textureDimensions(tS).y - u.groups) * 0.001)"};`) : body}`}
}
@compute @workgroup_size(${o.wg}, 1)
fn main(@builtin(local_invocation_index) l: u32, @builtin(workgroup_id) w: vec3u) {
  let g = l / ${T}u; let t = l % ${T}u;
  let lane = t / ${step}u; let r = ${row ? "t % 4u" : "0u"};
  let gr = w.x * ${G * R}u + g;
  ${o.aw ? `for (var i = l; i < u.kb * 4u; i += ${o.wg}u) { sA[i] = ${ld0("i")}; }
  workgroupBarrier();` : ""}
  var acc = ${AT}(0.0);
  ${loop}
  ${reduce}
}`
  }
  // pr-T: a thread per row pair (rows p and p + 2) and block, T threads per row group (2 pairs x T/2 lanes over K);
  // each lane writes its own partial sums (like ns). Options: wgN, un, sb (scales from a vec4 storage buffer).
  const prKernel = (v) => {
    const o = parse(v), T = o.n, lanes = T / 2, G = o.wg / T
    const rd = o.un
      ? `fn rd(Q: vec4u, a: array<vec4f, 8>) -> f32 {
  let m = 0x0F0F0F0Fu;
  let lo = dot(unpack4x8unorm(Q.x & m), a[0]) + dot(unpack4x8unorm(Q.y & m), a[1]) + dot(unpack4x8unorm(Q.z & m), a[2]) + dot(unpack4x8unorm(Q.w & m), a[3]);
  let hi = dot(unpack4x8unorm((Q.x >> 4u) & m), a[4]) + dot(unpack4x8unorm((Q.y >> 4u) & m), a[5]) + dot(unpack4x8unorm((Q.z >> 4u) & m), a[6]) + dot(unpack4x8unorm((Q.w >> 4u) & m), a[7]);
  return 255.0 * (lo + hi);
}`
      : `const SL = vec4u(0u, 8u, 16u, 24u);
const SH = vec4u(4u, 12u, 20u, 28u);
fn rd(Q: vec4u, a: array<vec4f, 8>) -> f32 {
  return dot(vec4f((vec4u(Q.x) >> SL) & vec4u(15u)), a[0]) + dot(vec4f((vec4u(Q.y) >> SL) & vec4u(15u)), a[1])
    + dot(vec4f((vec4u(Q.z) >> SL) & vec4u(15u)), a[2]) + dot(vec4f((vec4u(Q.w) >> SL) & vec4u(15u)), a[3])
    + dot(vec4f((vec4u(Q.x) >> SH) & vec4u(15u)), a[4]) + dot(vec4f((vec4u(Q.y) >> SH) & vec4u(15u)), a[5])
    + dot(vec4f((vec4u(Q.z) >> SH) & vec4u(15u)), a[6]) + dot(vec4f((vec4u(Q.w) >> SH) & vec4u(15u)), a[7]);
}`
    return `
struct U { kb: u32, slices: u32, kbSlice: u32, groups: u32, wx: u32, w32: u32 }
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read> bW: array<vec4<u32>>;
${o.sb ? "@group(0) @binding(2) var<storage, read> bS: array<vec4f>;" : "@group(0) @binding(2) var tS: texture_2d<f32>;"}
