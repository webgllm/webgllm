<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Recorded consumer prefix comparison</title><style>body{font:14px system-ui;background:#10151d;color:#e7edf5;padding:24px}button,input{font:inherit}button{padding:9px 14px}table{border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:6px 9px;border-bottom:1px solid #344151;text-align:left}pre{white-space:pre-wrap;max-height:36rem;overflow:auto}#status{margin:18px 0}</style></head><body><h1>Recorded consumer prefix comparison</h1><p>LFM3 GGUF · SDK chat + strict object move schema · model sampling defaults · reasoning off · maxTokens 8192. Two rounds reverse variant order.</p><button id="run" disabled>Run comparison</button> <button id="stop" disabled>Stop</button> <label><input id="captureTokens" type="checkbox" checked> Capture input tokens</label><div id="status" role="status">Loading SDK…</div><table><thead><tr><th>Round</th><th>Variant</th><th>Group</th><th>Case</th><th>Correct</th><th>Total ms</th><th>Prefill ms</th><th>Encode ms</th><th>Prefix ms</th><th>Input/cache</th><th>Batches</th></tr></thead><tbody id="rows"></tbody></table><details><summary>Full report</summary><pre id="report"></pre></details><script type="module">
import {chat} from '@tanstack/ai';
import {z} from 'zod';
const root=__ROOT_URL__,fixtureUrl=__FIXTURES_URL__;
const $=id=>document.getElementById(id),model='LiquidAI/LFM3-1.7B-GGUF';
let running=false,controller,activeCapture=null,report;
const nativeWorker=window.Worker;
const median=values=>{const a=values.filter(Number.isFinite).sort((a,b)=>a-b);const middle=Math.floor(a.length/2);return a.length?(a.length%2?a[middle]:(a[middle-1]+a[middle])/2):null};
function render(){const summaries=[];for(const variant of ['baseline','exact','memo'])for(const group of ['replay-cold','replay-changed','replay-retry','quality','negative']){const rows=report.results.filter(r=>r.variant===variant&&r.group===group);if(rows.length)summaries.push({variant,group,count:rows.length,legal:rows.filter(r=>r.legal).length,passed:rows.filter(r=>r.passed===true).length,totalMs:median(rows.map(r=>r.totalMs)),promptMs:median(rows.map(r=>r.nativeStats?.promptMs)),cachedTokens:median(rows.map(r=>r.nativeStats?.cachedTokens)),fullEncodeMs:median(rows.map(r=>r.nativeStats?.reviewFullEncodeMs)),prefixDiscoveryMs:median(rows.map(r=>r.nativeStats?.reviewPrefixDiscoveryMs))})}report.summary=summaries;$('report').textContent=JSON.stringify(report,null,2);window.__reviewCacheReport=report}
function addRow(row){const tr=document.createElement('tr');for(const value of[row.round,row.variant,row.group,row.caseId,row.error?'ERROR':row.passed===null?'legal '+row.legal:String(row.passed),row.totalMs?.toFixed(1),row.nativeStats?.promptMs?.toFixed(1),row.nativeStats?.reviewFullEncodeMs?.toFixed(1),row.nativeStats?.reviewPrefixDiscoveryMs?.toFixed(1),`${row.nativeStats?.inputTokens??'?'}/${row.nativeStats?.cachedTokens??'?'}`,row.nativeStats?.reviewBatchSizes?.join('+')]){const td=document.createElement('td');td.textContent=value??'';tr.append(td)}$('rows').append(tr);render()}
class ObservedWorker extends nativeWorker{constructor(...args){super(...args);this.addEventListener('message',event=>{const data=event.data;if(!activeCapture)return;if(data?.type==='done')activeCapture.done.push(structuredClone(data));if(data?.type==='error')activeCapture.errors.push(structuredClone(data))})}postMessage(message,...args){if(message?.type==='generate'&&activeCapture){activeCapture.requests.push(structuredClone(message));message={...message,reviewCaptureInputIds:$('captureTokens').checked}}return super.postMessage(message,...args)}}
const canonicalRequest=request=>{if(!request)return null;const {id,reviewOriginalSystem,reviewCaptureInputIds,...rest}=request;return rest};
$('stop').onclick=()=>controller?.abort(new DOMException('Stopped','AbortError'));
$('run').onclick=async()=>{if(running)return;running=true;controller=new AbortController();$('run').disabled=true;$('stop').disabled=false;$('rows').textContent='';window.Worker=ObservedWorker;report={startedAt:new Date().toISOString(),model,rounds:2,settings:{maxTokens:8192,reasoning:'off',sampling:'model defaults',context:'model default'},results:[],parityErrors:[]};const parity=new Map();let module;
try{const fixture=await(await fetch(fixtureUrl)).json();report.fixture=fixture;const plan=[];fixture.replay.forEach((item,i)=>{plan.push({item,group:i?'replay-changed':'replay-cold',key:'replay-'+i});plan.push({item,group:'replay-retry',key:'replay-'+i+'-retry'})});fixture.quality.forEach((item,i)=>plan.push({item,group:'quality',key:'quality-'+i}));fixture.negative.forEach((item,i)=>plan.push({item,group:'negative',key:'negative-'+i}));
for(let round=1;round<=2;round++){for(const variant of round===1?['baseline','exact','memo']:['memo','exact','baseline']){controller.signal.throwIfAborted();$('status').textContent=`Round ${round}/2 · loading ${variant}`;module=await import(/* @vite-ignore */root+`packages/webgl/.review-cache-qa/${variant}/index.ts`);const loadAt=performance.now();await module.loadModel(model);const loadMs=performance.now()-loadAt;const adapter=module.webglText(model);
try{for(const step of plan){controller.signal.throwIfAborted();const item=step.item;$('status').textContent=`Round ${round}/2 · ${variant} · ${step.group} · ${item.caseId}`;let raw,usage,answer,error;const wrapped=Object.create(adapter);wrapped.structuredOutput=async options=>{const result=await adapter.structuredOutput(options);raw=result.rawText;usage=result.usage;return result};const schema=z.strictObject({move:z.enum(item.choices.map(c=>c.label))});const capture={requests:[],done:[],errors:[]};activeCapture=capture;const began=performance.now();try{answer=await chat({adapter:wrapped,threadId:'review-recorded-consumer',systemPrompts:[item.systemPrompt],messages:[{role:'user',content:item.prompt}],outputSchema:schema,modelOptions:{maxTokens:8192},reasoning:'off',stream:false,abortController:controller})}catch(e){error=String(e?.stack??e)}const totalMs=performance.now()-began;activeCapture=null;const actual=capture.requests.at(-1),nativeStats=capture.done.at(-1)?.stats;const choice=item.choices.find(c=>c.label===answer?.move);const row={round,variant,group:step.group,key:step.key,caseId:item.caseId,source:item.source,loadMs,totalMs,answer,rawText:raw,usage,nativeStats,actualRequest:actual,legal:!!choice,moveId:choice?.id,passed:item.expectedMoveIds?.length?!!choice&&item.expectedMoveIds.includes(choice.id):null,error,workerErrors:capture.errors};const compare={request:canonicalRequest(actual),inputIds:nativeStats?.reviewInputIds};const previous=parity.get(step.key);if(previous&&JSON.stringify(previous)!==JSON.stringify(compare)){report.parityErrors.push({round,variant,key:step.key,message:'Actual request or full encoded input differs from earlier variant'});row.parityError=true}else if(!previous)parity.set(step.key,compare);report.results.push(row);addRow(row);if(controller.signal.aborted)throw controller.signal.reason}}finally{await module.unloadModel();module=null}}
}report.completedAt=new Date().toISOString();$('status').textContent=`Complete · ${report.results.length} rows · ${report.parityErrors.length} parity errors`}
catch(error){report.error=String(error?.stack??error);$('status').textContent=controller.signal.aborted?'Stopped; partial results retained.':'Failed: '+String(error)}finally{activeCapture=null;if(module)await module.unloadModel();window.Worker=nativeWorker;running=false;$('run').disabled=false;$('stop').disabled=true;render()}};
$('run').disabled=false;$('status').textContent='Ready. No inference started.';
</script></body></html>
